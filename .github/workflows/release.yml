name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  verify-version:
    name: verify version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Tag matches Cargo.toml and CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME != Cargo.toml version $crate"
            exit 1
          fi
          if ! grep -Fq "## [$crate]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$crate]' section"
            exit 1
          fi
          if grep -Fq "## [$crate] - Unreleased" CHANGELOG.md; then
            echo "::error::CHANGELOG.md still dates $crate as Unreleased; set the release date"
            exit 1
          fi

  build:
    name: build
    needs: [ci, verify-version]
    uses: ./.github/workflows/build.yml

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: packctl-*
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum packctl-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: artifacts/packctl-*.tar.gz

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Everything between this version's heading and the next one.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]*\]: / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || { echo "::error::empty release notes for $version"; exit 1; }
          cat RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/packctl-*.tar.gz
            artifacts/SHA256SUMS
