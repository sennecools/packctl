name: rolling

# Publishes main as the `rolling` pre-release once ci passed on it. It reuses
# ci's verdict instead of running the checks a second time.
#
# Only the commit that is still the tip of main is published:
# - the tag never moves back, even when an older ci run on main is re-run;
# - under workflow_run, `github.sha` (the commit the provenance attestation
#   records) is the tip of main when ci finished, so it names the commit that
#   was built only while that commit is still the tip.
# A commit that main moved past before its ci finished is skipped; the next
# green commit publishes instead.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_sha == github.sha
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
      build_sha: ${{ github.event.workflow_run.head_sha }}

  publish:
    name: update rolling release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level, so only runs that built something queue here: a failed or
    # cancelled ci run never evicts a pending publish. Never cancel a
    # half-finished publish.
    concurrency:
      group: rolling
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Still the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip="$(gh api "repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq .sha)"
          if [ "$tip" = "$SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$BRANCH is at $tip now; not publishing $SHA over it"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v5
        if: steps.tip.outputs.publish == 'true'
        with:
          path: artifacts
          pattern: packctl-*
          merge-multiple: true

      - name: Checksums
        if: steps.tip.outputs.publish == 'true'
        working-directory: artifacts
        run: |
          sha256sum packctl-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@v3
        if: steps.tip.outputs.publish == 'true'
        with:
          subject-path: artifacts/packctl-*.tar.gz

      - name: Move the rolling tag
        if: steps.tip.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/rolling" -f sha="$SHA" -F force=true \
            || gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/rolling -f sha="$SHA"

      # The archives are replaced in place. The old checksums go first, so an
      # install racing this update fails with "could not download release
      # checksums" (install.sh then says to retry) rather than a checksum
      # mismatch; the new SHA256SUMS goes up last, once every archive it
      # lists is there.
      - name: Remove the old checksums
        if: steps.tip.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset rolling SHA256SUMS -R "$GITHUB_REPOSITORY" -y || true

      - name: Upload archives
        if: steps.tip.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: rolling (latest main)
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Continuous build from `main`, not a stable release.
            Commit: ${{ github.event.workflow_run.head_sha }}
          files: artifacts/packctl-*.tar.gz

      - name: Upload checksums
        if: steps.tip.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: rolling (latest main)
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Continuous build from `main`, not a stable release.
            Commit: ${{ github.event.workflow_run.head_sha }}
          files: artifacts/SHA256SUMS
