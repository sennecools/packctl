name: rolling

on:
  push:
    branches: [main]

permissions:
  contents: write

# Only the most recent commit to main should win the rolling build.
concurrency:
  group: rolling
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all

  build:
    name: build-${{ matrix.target }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zig
        uses: mlugg/setup-zig@v1

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build static musl release
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Stage archive
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/packctl" "dist/packctl-${{ matrix.target }}"
          tar -C dist -czf "dist/packctl-${{ matrix.target }}.tar.gz" "packctl-${{ matrix.target }}"

      - name: Upload archive
        uses: actions/upload-artifact@v5
        with:
          name: packctl-${{ matrix.target }}
          path: dist/packctl-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: update rolling release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download archives
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: packctl-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum packctl-*.tar.gz > SHA256SUMS

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: rolling (latest main)
          body: |
            Continuous build from `main` — not a stable release.

            Commit: ${{ github.sha }}
          prerelease: true
          files: |
            artifacts/packctl-*.tar.gz
            artifacts/SHA256SUMS
