name: Feature request
description: Suggest an idea or improvement for packctl.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like packctl to handle it? Example commands or config are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other tools you tried.
    validations:
      required: false

  - type: dropdown
    id: provider
    attributes:
      label: Provider (if relevant)
      options:
        - Not provider-specific
        - CurseForge
        - Modrinth
        - Local
    validations:
      required: false
