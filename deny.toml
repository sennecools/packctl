# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`; CI runs the same check on every push.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # chrono is unmaintained (no vulnerability). It only formats and parses
    # timestamps in state.json and snapshots; migrating to jiff or time is
    # tracked separately because it touches the persisted state format.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, no known vulnerability; migration to jiff planned" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
